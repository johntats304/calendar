<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Smart Calendar Task Board</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400..700&family=Quicksand:wght@400..700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css"></head>
<body class="th-white" style="display:flex;align-items:center;justify-content:center">
<form class="panel" id="f" style="width:100%;max-width:380px;display:grid;gap:10px;margin:0">
  <div style="text-align:center"><div style="font-size:2.4rem">🗓️</div><h1>Smart Task Board</h1><p class="sub">Log in to open your calendar</p></div>
  <input id="u" placeholder="Username" autocomplete="username" required autofocus>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" required>
  <div id="err" class="bad" style="font-size:.75rem;font-weight:700;min-height:1em"></div>
  <button class="btn pri" type="submit">Log in</button>
  <p class="sub" id="hint" hidden style="text-align:center;background:var(--soft);border-radius:10px;padding:8px">Default admin: <b>admin</b> / <b>admin123</b><br>(change it after logging in)</p>
</form>
<script src="auth.js"></script>
<script>
(async()=>{
  await ensureAdmin();
  if(currentUser())return location.replace('index.html');
  const a=getUsers().find(x=>x.id==='u_admin');
  if(a&&a.mustChange)document.getElementById('hint').hidden=false;
  document.getElementById('f').onsubmit=async e=>{
    e.preventDefault();
    const u=await login(document.getElementById('u').value,document.getElementById('p').value);
    if(u)location.href='index.html';
    else document.getElementById('err').textContent='Wrong username or password, or account disabled.';
  };
})();
</script></body></html>
